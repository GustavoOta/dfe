[package]
name = "dfe"
version = "0.8.2"
edition = "2021"
description = "NF-e, NFC-e e NFS-e Nacional em Rust: emissão, eventos, assinatura, XSD, DANFE e ESC/POS na SEFAZ (27 UFs). Brazilian electronic invoices (nota fiscal) for SEFAZ."
license = "MIT"
readme = "README.md"
keywords = ["nfe", "nfce", "nfse", "sefaz", "nota-fiscal"]
categories = ["api-bindings", "finance", "web-programming::http-client"]

homepage = "https://github.com/GustavoOta/dfe"
repository = "https://github.com/GustavoOta/dfe"

exclude = [
    "dfe/manuais_sefaz/**",
    "dfe/shema/**",
    "dfe/thirdparty/**",
    "docs/**",
    "distribuicao-logs/**",
    "testes/**",
    ".claude/**",
    ".vscode/**",
    "src/assets/**",
    "sample55.xml",
    "sample65.xml"
]

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
# A página do docs.rs mostra também a NFS-e (opt-in).
features = ["nfse"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
branch = "master"
install = ["libxml2"]

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static", install = ["libxml2"] }

[profile.release]
debug = false

[features]
# Mantém o conjunto histórico de funcionalidades de NF-e/NFC-e.
# Sem `danfe` e `escpos-base`, a dfe deixa de pedir as dependências de renderização.
default = ["emissao", "danfe", "escpos", "distribuicao"]
# Montagem, assinatura e emissão de NF-e/NFC-e com validação obrigatória.
emissao = ["validacao-xsd"]
validacao-xsd = ["dep:libxml"]
# DANFE em PDF (NF-e A4/80mm, NFC-e 80mm).
danfe = ["dep:printpdf", "dep:image", "dep:barcoders", "dep:qrcodegen"]
# Impressão via ESC/POS (builder genérico e cupons fiscais).
escpos = ["escpos-base"]
# Builder ESC/POS genérico, sem os builders de DANFE de NF-e/NFC-e.
escpos-base = ["dep:font8x8", "dep:image", "dep:barcoders", "dep:qrcodegen"]
# Distribuição de DF-e (AN) + manifestação do destinatário (fluxo inbound; gzip via flate2).
distribuicao = ["dep:flate2"]
# NFS-e Nacional: DPS, assinatura, XSD embutido e cliente REST da SEFIN (XML em gzip).
nfse = ["dep:flate2", "validacao-xsd"]
# Liga a camada de testes que bate na SEFAZ (homologação). Fora do `cargo test` padrão.
sefaz-live = ["emissao"]

[dev-dependencies]
# Golden/snapshot dos XMLs no refactor — só em `cargo test`, não vai no binário do consumidor.
# feature `filters`: redação por regex de campos voláteis (dhEvento, idLote, SignatureValue).
insta = { version = "1", features = ["filters"] }
# Carrega .env nos testes gated (camada sefaz-live) — dev-only, como o insta.
dotenvy = "0.15"

[dependencies]
base64 = "0.22.1"
barcoders = { version = "2.0.0", optional = true }
chrono = "0.4.38"
chrono-tz = "0.10.0"
flate2 = { version = "1.0", optional = true }
font8x8 = { version = "0.2", optional = true }
hex = "0.4.3"
image = { version = "0.24", default-features = false, features = ["png", "jpeg"], optional = true }
libxml = { version = "=0.3.3", optional = true }
printpdf = { version = "0.7.0", optional = true }
quick-xml = { version = "0.37.1", features = ["encoding", "serialize"] }
qrcodegen = { version = "1.8", optional = true }
rand = "0.8.5"
regex = "1.11.1"
reqwest = { version = "0.12.9", features = ["native-tls", "json", "gzip", "blocking"] }
rust_decimal = "1.38.0"
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.133"
sha1 = "0.10.6"
sha2 = "0.10.8"
tokio = { version = "1.41.1", features = ["full"] }

# Fora do Windows o certificado A1 é aberto pelo OpenSSL do sistema (no Windows é o CAPI).
# Já está no grafo Linux via native-tls; aqui entra direto para ler o PFX e assinar.
[target.'cfg(not(target_os = "windows"))'.dependencies]
openssl = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_Graphics_Printing", "Win32_Graphics_Gdi", "Win32_System_Time"] }
